"><small style="color:var(--c);letter-spacing:.25em">NEXUS</small><h2>The city remembers every transaction.</h2><p style="max-width:650px;color:#9aaabd;line-height:1.8">Surface and Undercity are one economy with two faces. Government stabilizes production and influence; Mafia accelerates underground networks while increasing risk. Missions, collection, market activity and progression feed back into the same player state.</p><div class="statsgrid"><div><b>'+s.eco.networks+'</b><small>NETWORKS</small></div><div><b>'+s.eco.influence+'</b><small>INFLUENCE</small></div><div><b>'+s.eco.risk+'</b><small>RISK</small></div><div><b>'+s.era+'/12</b><small>ERA</small></div></div></article></div>'},profile:function(){var s=G.s;return '<div class="section"><div class="card profile"><div class="avatar">🧑‍💻</div><div><small>LOCAL PLAYER</small><h2>'+s.player.name+'</h2><span>LEVEL '+s.player.level+' · XP '+s.player.xp+'</span></div><b class="online">● ONLINE SIM</b></div><div class="statsgrid"><div><b>'+Math.floor(s.eco.coins).toLocaleString()+'</b><small>COINS</small></div><div><b>'+G.income().toFixed(1)+'</b><small>COIN/S</small></div><div><b>'+s.owned.length+'/20</b><small>HEROES</small></div><div><b>'+s.eco.energy+'</b><small>ENERGY</small></div><div><b>'+s.eco.data+'</b><small>DATA</small></div><div><b>'+s.eco.risk+'</b><small>RISK</small></div></div><div class="settings"><button class="btn" data-a="lang">🌐 '+s.lang.toUpperCase()+'</button><button class="btn" data-a="save">💾 '+t('save')+'</button><button class="btn" data-a="export">⬇ '+t('export')+'</button><button class="btn" data-a="import">⬆ '+t('import')+'</button><button class="btn" data-a="reset">↻ '+t('reset')+'</button></div><div class="card notice"><b style="color:var(--c)">'+t('simulation')+'</b><br>Virtual players, market listings, auctions, chat messages, offline income and state changes are generated locally through one command/state/event flow. No backend is required for development.</div></div>'}};
const ASSET_BASE='https://raw.githubusercontent.com/Hidencod/tge-assets/main/';const BUILDING_ASSETS={workshop:'packs/city-kit-commercial/thumbs/building-a.webp',stadium:'packs/city-kit-commercial/thumbs/building-b.webp',studio:'packs/city-kit-commercial/thumbs/building-c.webp',commerce:'packs/city-kit-commercial/thumbs/building-d.webp',research:'packs/city-kit-commercial/thumbs/building-e.webp',forge:'packs/city-kit-commercial/thumbs/building-f.webp',fight:'packs/city-kit-commercial/thumbs/building-g.webp',signal:'packs/city-kit-commercial/thumbs/building-h.webp',black:'packs/city-kit-commercial/thumbs/building-i.webp',data:'packs/city-kit-commercial/thumbs/building-j.webp'};const WORLD_ASSETS={surface:['https://cdn.polyhaven.com/asset_img/primary/urban_street_01.png?height=1200','https://cdn.polyhaven.com/asset_img/primary/urban_street_02.png?height=1200'],undercity:['https://cdn.polyhaven.com/asset_img/primary/concrete.png?height=1200','https://cdn.polyhaven.com/asset_img/primary/concrete_pavement_02.png?height=1200']};function assetUrl(p){return /^https?:\/\//.test(p)?p:ASSET_BASE+p}function uid(){return Math.random().toString(36).slice(2)+Date.now()}
function bind(){
var navIndex=Math.max(0,Math.min(4,(G.s.cities[G.s.side]||{}).district||0));
var districts=[{x:12000,y:6500},{x:6000,y:18000},{x:18000,y:18000},{x:12000,y:29500},{x:12000,y:18000}];
var cam={x:0,y:0,zoom:.06,animating:false,animId:0};
var pointer=null,candidate=null,dragMoved=false;
var SWIPE_MIN=55,ANIM_MS=1000;

function stage(){return document.getElementById('worldStage')}
function canvas(){return document.getElementById('worldCanvas')}
function districtZoom(){
var s=stage();if(!s)return .06;
var span=5200;
return Math.max(.035,Math.min(.16,Math.min(s.clientWidth/span,s.clientHeight/span)*.92));
}
function applyCam(){
var w=canvas();if(!w)return;
w.style.setProperty('--cam-x',cam.x+'px');
w.style.setProperty('--cam-y',cam.y+'px');
w.style.setProperty('--zoom',cam.zoom.toFixed(4));
}
function targetFor(i){
var s=stage(),p=districts[i],z=districtZoom();
if(!s)return {x:0,y:0,zoom:z};
return {x:-(p.x-12000)*z,y:-(p.y-18000)*z,zoom:z};
}
function centerTo(i){
var w=canvas(),s=stage(),p=districts[i],z=districtZoom();
if(!w||!s)return;
var tx=-(p.x-12000)*z,ty=-(p.y-18000)*z;
cam.x=tx;cam.y=ty;cam.zoom=z;applyCam();
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function animateTo(i){
if(i<0||i>=districts.length||i===navIndex||cam.animating)return false;
var from={x:cam.x,y:cam.y,zoom:cam.zoom},to=targetFor(i),started=performance.now();
cam.animating=true;
cam.animId++;
var id=cam.animId;
function frame(now){
if(id!==cam.animId)return;
var p=Math.min(1,(now-started)/ANIM_MS),e=ease(p);
cam.x=from.x+(to.x-from.x)*e;
cam.y=from.y+(to.y-from.y)*e;
cam.zoom=from.zoom+(to.zoom-from.zoom)*e;
applyCam();
if(p<1)requestAnimationFrame(frame);
else{cam.x=to.x;cam.y=to.y;cam.zoom=to.zoom;cam.animating=false;navIndex=i;G.s.cities[G.s.side].district=i;G.save();applyCam();G.render()}
}
requestAnimationFrame(frame);
return true;
}
function nextForSwipe(dx,dy){
var ax=Math.abs(dx),ay=Math.abs(dy);
if(Math.max(ax,ay)<SWIPE_MIN)return -1;
if(ax>ay){
if(dx<0){return navIndex===0?1:navIndex===2?4:navIndex===4?1:navIndex===3?1:-1}
return navIndex===0?2:navIndex===1?4:navIndex===4?2:navIndex===3?2:-1;
}
if(dy<0){
return navIndex===1?0:navIndex===2?0:navIndex===3?4:navIndex===4?0:-1;
}
return navIndex===0?4:navIndex===1?3:navIndex===2?3:navIndex===4?3:-1;
}
function reset(){pointer=null;candidate=null;dragMoved=false}
document.addEventListener('pointerdown',function(e){
var s=stage();if(!s||e.target.closest('[data-a]')||e.target.closest('.world-hud'))return;
pointer={id:e.pointerId,x:e.clientX,y:e.clientY};
candidate=e.target.closest('.world-building')?.dataset.node||null;
dragMoved=false;
if(s.setPointerCapture){try{s.setPointerCapture(e.pointerId)}catch(_){}}
});
document.addEventListener('pointermove',function(e){
if(!pointer||pointer.id!==e.pointerId||cam.animating)return;
if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>10){dragMoved=true;candidate=null}
});
function finish(e){
if(!pointer||pointer.id!==e.pointerId)return;
var dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;
var id=nextForSwipe(dx,dy);
if(id>=0&&!dragMoved)animateTo(id);
else if(id>=0&&dragMoved)animateTo(id);
else if(!dragMoved&&candidate)showWorldInfo(candidate);
reset();
}
document.addEventListener('pointerup',finish);
document.addEventListener('pointercancel',function(){reset()});
window.addEventListener('resize',function(){
if(!cam.animating)centerTo(navIndex);
});
centerTo(navIndex);
}

function showWorldInfo(id){var s=G.s,c=s.cities[s.side],b=c.buildings[id],def=BT[s.side].find(function(x){return x[0]===id}),pop=document.getElementById('worldInfo');if(!b||!def||!pop)return;pop.innerHTML='<button class="btn close" onclick="this.parentNode.classList.remove(\'show\')">×</button><b>'+def[2]+' '+def[1]+'</b><small>'+s.side.toUpperCase()+' · '+c.districts[c.district].name+'</small><p>'+(b.unlocked?'Current level: <strong>LV '+b.level+'</strong><br>Production: <strong>+'+(b.income*b.level).toFixed(0)+'</strong>/tick':'This building is not active yet.')+'</p><button class="btn primary" data-a="'+(b.unlocked?'upgrade':'build')+'" data-p="'+id+'">'+(b.unlocked?t('upgrade'):t('build'))+' '+b.cost+'</button>';pop.classList.add('show')}

function nav(){return '<button data-v="world"><b>🌐</b>WORLD</button><button data-v="collection"><b>🧬</b>COLLECT</button><button data-v="market"><b>🪙</b>MARKET</button><button data-v="chat"><b>💬</b>CHAT</button><button data-v="missions"><b>⚡</b>MISSIONS</button><button data-v="lore"><b>📖</b>LORE</button><button data-v="profile"><b>☰</b>PROFILE</button>'}
function boot(){G.load();G.offline();document.getElementById('app').innerHTML='<div class="shell"><header class="top"><div class="brand">SYSTeM<small>NEXUS // LOCAL ONLINE SIMULATION</small></div><div class="stats"><div class="stat"><b id="coins">0</b><span>🪙 COINS</span></div><div class="stat"><b id="flow">0</b><span>FLOW</span></div><div class="stat"><b id="eraTop">ERA 1</b><span>PROGRESS</span></div></div><div class="tools"><button class="btn" data-a="lang">🌐</button><button class="btn" data-a="save">💾</button></div></header><main class="main"><div id="screen" class="screen"></div></main><nav class="nav">'+nav()+'</nav></div>';bind();G.render();G.timer=setInterval(function(){G.s.eco.coins+=G.income();G.s.eco.last=Date.now();G.renderTop()},1000);G.sim=setInterval(function(){G.action('sim')},7000)}document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
