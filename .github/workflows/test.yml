name: Server Test

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "package.json"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check server syntax
        run: node --check server/src/server.js

      - name: Run tests
        run: npm test

      - name: Start server
        run: |
          node server/src/server.js > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Check API health
        run: |
          response=$(curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/health)

          echo "API response:"
          echo "$response"

          node -e '
            const response = JSON.parse(process.argv[1]);

            if (response.ok !== true) {
                throw new Error("API response.ok is not true");
            }

            if (
                !response.data ||
                response.data.status !== "ok"
            ) {
                throw new Error("API health status is not ok");
            }

            console.log("API health response verified");
          ' "$response"

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Show server log on failure
        if: failure()
        run: cat server.log